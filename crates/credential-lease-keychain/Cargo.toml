[package]
name = "credential-lease-keychain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "OS keychain custody backend for the Credential-Lease surface: protected generic-password items on the macOS Keychain, fail-closed elsewhere."

[dependencies]
credential-lease.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
# The swap journal names its recording process unambiguously through
# proc_pidinfo's reported start instant, so recovery can tell a live
# writer from an interrupted one across pid reuse.
libc = "0.2"
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
security-framework-sys = { version = "2.17.0", features = ["OSX_10_15"] }
uuid.workspace = true
zeroize.workspace = true
