[package]
name = "credential-lease"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Host-neutral credential lease contract: custody holds root credentials; runtimes receive process-bound, revocable, time-limited leases."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize.workspace = true

# The inherited-descriptor intake reads and closes the descriptor itself.
# `std::fs::File` cannot represent it safely: std aborts on an EBADF owned
# descriptor instead of letting the receiver fail closed with a stable code.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Descriptor inheritance (pipe creation, close-on-exec, dup2) in the
# end-to-end handoff test.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
