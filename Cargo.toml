[workspace]
resolver = "2"
members = ["crates/credential-lease"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Unka-Malloc/Credential-Lease"

[workspace.dependencies]
anyhow = "1.0.98"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
uuid = { version = "1.16", features = ["v4"] }
licoup-foundation = "0.3.0"
