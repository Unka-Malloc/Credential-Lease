[workspace]
resolver = "2"
members = ["crates/credential-lease", "crates/credential-lease-keychain"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Unka-Malloc/Credential-Lease"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.98"
credential-lease = { path = "crates/credential-lease", version = "0.3.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
uuid = { version = "1.16", features = ["v4"] }
zeroize = "1.8"
